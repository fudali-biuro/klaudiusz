<style>.fudali-lb{position:fixed;inset:0;background:rgba(20,30,15,.92);display:none;align-items:center;justify-content:center;z-index:99999}.fudali-lb.on{display:flex}.fudali-lb-i{max-width:92vw;max-height:88vh;border-radius:12px}.fudali-lb button{position:absolute;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:30px;line-height:1;cursor:pointer;touch-action:manipulation}.fudali-lb button:hover,.fudali-lb button:focus-visible{background:rgba(255,255,255,.32);outline:2px solid #fff}.fudali-lb-x{top:16px;right:16px}.fudali-lb-p{left:16px;top:50%}.fudali-lb-n{right:16px;top:50%}.elementor-gallery-item{cursor:zoom-in}</style><script>(function(){var ov,items=[],idx=0;function build(){if(ov)return ov;ov=document.createElement('div');ov.className='fudali-lb';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.innerHTML='<button type=button class=fudali-lb-x aria-label=Zamknij>&times;</button><button type=button class=fudali-lb-p aria-label=Poprzednie>&#8249;</button><button type=button class=fudali-lb-n aria-label=Nastepne>&#8250;</button><img class=fudali-lb-i alt=>';document.body.appendChild(ov);return ov;}function list(){return Array.prototype.filter.call(document.querySelectorAll('.elementor-gallery-item'),function(e){return e.offsetParent!==null;});}function src(e){var d=e.querySelector('.e-gallery-image');var s=(d&&d.style.backgroundImage)||'';s=s.replace('url(','').replace(')','').split(String.fromCharCode(34)).join('');var q=s.lastIndexOf('.');var base=s.slice(0,q),ext=s.slice(q);var d=base.lastIndexOf('-');var tail=base.slice(d+1).split('x');if(d>0&&tail.length==2&&tail[0]&&tail[1]&&!isNaN(tail[0])&&!isNaN(tail[1]))s=base.slice(0,d)+ext;return s;}function show(i){items=list();if(!items.length)return;idx=(i+items.length)%items.length;build().querySelector('.fudali-lb-i').src=src(items[idx]);ov.classList.add('on');document.body.style.overflow='hidden';ov.querySelector('.fudali-lb-x').focus(
